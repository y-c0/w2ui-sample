<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>店舗一覧（w2ui 1.5 サンプル）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/w2ui@1.5.3/w2ui-1.5.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/w2ui@1.5.3/w2ui-1.5.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; margin: 20px; }
  h1 { font-size: 18px; }
  #toolbar { margin-bottom: 10px; }
  #toolbar button { padding: 6px 14px; margin-right: 8px; cursor: pointer; }
  #btn-submit { background: #2b6cb0; color: #fff; border: 1px solid #2b6cb0; border-radius: 3px; }
  #btn-add { background: #fff; border: 1px solid #999; border-radius: 3px; }
  #grid { width: 100%; height: 420px; }
  .btn-edit, .btn-done { padding: 2px 10px; cursor: pointer; }
  .edit-input, .edit-select { width: 95%; box-sizing: border-box; }
  .new-badge { color: #999; font-style: italic; }
</style>
</head>
<body>

<h1>店舗一覧</h1>

<div id="toolbar">
  <button id="btn-add">＋ 行追加</button>
  <button id="btn-submit">登録</button>
</div>

<div id="grid"></div>

<script>
let grid;
let prefectures = [];
let editingRecid = null;   // 現在編集中の行の recid（null=編集中の行なし）
let newRowSeq = 0;         // 未登録行の recid 採番用（負数にして既存IDと衝突しないようにする）

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

function prefName(code) {
  const p = prefectures.find((p) => p.code === code);
  return p ? p.name : '';
}

// select/input から呼ばれ、編集中データをレコードに反映するだけ（w2ui の再描画はしない＝入力中のフォーカス維持のため）
function updateField(recid, field, value) {
  const rec = grid.records.find((r) => r.recid === recid);
  if (rec) rec[field] = value;
}

function startEdit(recid) {
  if (editingRecid !== null && editingRecid !== recid) {
    alert('編集中の行があります。先に「完了」を押してください。');
    return;
  }
  editingRecid = recid;
  grid.refresh();
}

function finishEdit(recid) {
  const rec = grid.records.find((r) => r.recid === recid);
  if (!rec.name || !rec.pref_code) {
    alert('店舗名と都道府県を入力してください。');
    return;
  }
  editingRecid = null;
  grid.refresh();
}

const columns = [
  {
    field: 'id', caption: '店舗ID', size: '100px', sortable: true,
    render: (record) => (record.id ? record.id : '<span class="new-badge">(未登録)</span>')
  },
  {
    field: 'name', caption: '店舗名', size: '35%',
    render: (record) => {
      if (record.recid === editingRecid) {
        return `<input type="text" class="edit-input" value="${escapeHtml(record.name)}"
                  oninput="updateField(${record.recid},'name',this.value)">`;
      }
      return escapeHtml(record.name);
    }
  },
  {
    field: 'pref_code', caption: '都道府県', size: '25%',
    render: (record) => {
      if (record.recid === editingRecid) {
        const opts = ['<option value="">選択してください</option>']
          .concat(prefectures.map((p) =>
            `<option value="${p.code}" ${p.code === record.pref_code ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
          )).join('');
        return `<select class="edit-select" onchange="updateField(${record.recid},'pref_code',this.value)">${opts}</select>`;
      }
      return escapeHtml(prefName(record.pref_code));
    }
  },
  {
    field: 'actions', caption: '', size: '110px',
    render: (record) => (
      record.recid === editingRecid
        ? `<button class="btn-done" onclick="finishEdit(${record.recid})">完了</button>`
        : `<button class="btn-edit" onclick="startEdit(${record.recid})">編集</button>`
    )
  }
];

function addRow() {
  if (editingRecid !== null) {
    alert('編集中の行があります。先に「完了」を押してください。');
    return;
  }
  newRowSeq -= 1;
  const recid = newRowSeq; // 負数なのでサーバ採番済みIDと衝突しない
  grid.records.unshift({ recid, id: null, name: '', pref_code: '' });
  editingRecid = recid;
  grid.refresh();
}

function submitAll() {
  if (editingRecid !== null) {
    alert('編集中の行があります。先に「完了」を押してください。');
    return;
  }
  for (const r of grid.records) {
    if (!r.name || !r.pref_code) {
      alert('未入力の項目がある行があります。');
      return;
    }
  }

  const payload = {
    stores: grid.records.map((r) => ({ id: r.id, name: r.name, pref_code: r.pref_code }))
  };

  fetch('/api/stores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then((res) => {
      if (!res.ok) throw new Error('サーバエラー');
      return res.json();
    })
    .then((data) => {
      grid.records = data.stores.map((s) => ({ recid: s.id, id: s.id, name: s.name, pref_code: s.pref_code }));
      editingRecid = null;
      grid.refresh();
      alert('登録しました。');
    })
    .catch((err) => alert('送信に失敗しました: ' + err.message));
}

$(function () {
  Promise.all([
    fetch('/api/prefectures').then((r) => r.json()),
    fetch('/api/stores').then((r) => r.json())
  ]).then(([prefRes, storeRes]) => {
    prefectures = prefRes.prefectures;
    const records = storeRes.stores.map((s) => ({ recid: s.id, id: s.id, name: s.name, pref_code: s.pref_code }));

    $('#grid').w2grid({
      name: 'grid',
      header: '店舗一覧',
      show: { header: false, toolbar: false, footer: true, lineNumbers: false },
      columns: columns,
      records: records
    });
    grid = w2ui.grid;

    $('#btn-add').on('click', addRow);
    $('#btn-submit').on('click', submitAll);
  });
});
</script>

</body>
</html>
